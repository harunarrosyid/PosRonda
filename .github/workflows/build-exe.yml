name: Build PosRonda Windows EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build PosRonda Windows (Full & Lite)
    runs-on: windows-latest

    steps:
    - name: 1. Checkout Repository
      uses: actions/checkout@v4

    - name: 2. Setup Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: 3. Detect App Version
      shell: pwsh
      run: |
        $ver = (python -c "import sys; sys.path.insert(0, 'src'); import posronda; print(posronda.__version__)").Trim()
        Write-Host "Detected PosRonda Version: $ver"
        "APP_VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

    - name: 4. Install Dependencies & Build Tools
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: 5. Compile Extensions with Cython
      run: |
        python setup_cython.py build_ext --inplace
        dir src\posronda\core\*.pyd

    - name: 6. Build PosRonda-Lite.exe
      shell: pwsh
      run: |
        Write-Host "===> Membangun PosRonda Lite Edition (Tanpa FFmpeg internal)..."
        $env:POSRONDA_EXE_NAME = "PosRonda-Lite"
        pyinstaller PosRonda.spec --clean --noconfirm
        if (Test-Path "dist/PosRonda-Lite.exe") {
          Write-Host "PosRonda-Lite.exe berhasil dibuat."
        } else {
          Write-Error "Gagal membuat dist/PosRonda-Lite.exe"
          exit 1
        }

    - name: 7. Download Official FFmpeg for Full Edition
      shell: pwsh
      run: |
        Write-Host "===> Mengunduh FFmpeg resmi dengan dukungan Intel QuickSync..."
        $url = "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip"
        Invoke-WebRequest -Uri $url -OutFile "ffmpeg.zip"
        Expand-Archive -Path "ffmpeg.zip" -DestinationPath "ff_temp"
        $ffExe = Get-ChildItem -Path "ff_temp" -Filter "ffmpeg.exe" -Recurse | Select-Object -First 1
        if ($ffExe) {
          Copy-Item $ffExe.FullName -Destination "ffmpeg.exe"
          Write-Host "ffmpeg.exe berhasil diekstrak:" (Get-Item "ffmpeg.exe").Length "bytes"
        } else {
          Write-Error "ffmpeg.exe tidak ditemukan di dalam paket zip!"
          exit 1
        }
        Remove-Item -Recurse -Force "ffmpeg.zip", "ff_temp"

    - name: 8. Build PosRonda-Full.exe
      shell: pwsh
      run: |
        Write-Host "===> Membangun PosRonda Full Edition (Dengan FFmpeg terintegrasi)..."
        $env:POSRONDA_EXE_NAME = "PosRonda-Full"
        pyinstaller PosRonda.spec --noconfirm
        if (Test-Path "dist/PosRonda-Full.exe") {
          Write-Host "PosRonda-Full.exe berhasil dibuat."
        } else {
          Write-Error "Gagal membuat dist/PosRonda-Full.exe"
          exit 1
        }

    - name: 9. Package Release ZIP Archives
      shell: pwsh
      run: |
        Write-Host "===> Mengemas Paket Full Edition (v$($env:APP_VERSION))..."
        New-Item -ItemType Directory -Force -Path pkg-full
        Copy-Item dist\PosRonda-Full.exe -Destination pkg-full\PosRonda.exe
        Copy-Item ffmpeg.exe -Destination pkg-full\
        Copy-Item config.json -Destination pkg-full\
        Copy-Item docs\PANDUAN.md -Destination pkg-full\
        Compress-Archive -Path pkg-full\* -DestinationPath "PosRonda-v$($env:APP_VERSION)-Full.zip" -Force

        Write-Host "===> Mengemas Paket Lite Edition (v$($env:APP_VERSION))..."
        New-Item -ItemType Directory -Force -Path pkg-lite
        Copy-Item dist\PosRonda-Lite.exe -Destination pkg-lite\PosRonda.exe
        Copy-Item config.json -Destination pkg-lite\
        Copy-Item docs\PANDUAN.md -Destination pkg-lite\
        Compress-Archive -Path pkg-lite\* -DestinationPath "PosRonda-v$($env:APP_VERSION)-Lite.zip" -Force

    - name: 10. Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: PosRonda-Windows-v${{ env.APP_VERSION }}
        path: |
          dist/PosRonda-Full.exe
          dist/PosRonda-Lite.exe
          PosRonda-v*.zip
          config.json
          docs/PANDUAN.md
        retention-days: 30

    - name: 11. Publish GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ env.APP_VERSION }}
        name: "PosRonda v${{ env.APP_VERSION }} (Windows Release)"
        prerelease: false
        generate_release_notes: true
        body: |
          ### PosRonda v${{ env.APP_VERSION }} - Surveillance Hub & Live Streaming Engine

          Rilis resmi aplikasi PosRonda v${{ env.APP_VERSION }} untuk sistem operasi Windows 64-bit.
          Tersedia dalam dua varian instalasi:

          ---

          ### 📦 Pilihan Unduhan:

          #### 1. PosRonda Full Edition (Rekomendasi Utama untuk Semua Pengguna)
          *Paket all-in-one tanpa instalasi dependensi tambahan. Python & FFmpeg sudah terintegrasi.*
          - **[PosRonda-v${{ env.APP_VERSION }}-Full.zip](https://github.com/harunarrosyid/PosRonda/releases/download/v${{ env.APP_VERSION }}/PosRonda-v${{ env.APP_VERSION }}-Full.zip)**: Paket ZIP lengkap berisi `PosRonda.exe`, `ffmpeg.exe`, `config.json`, dan `PANDUAN.md`.
          - **[PosRonda-Full.exe](https://github.com/harunarrosyid/PosRonda/releases/download/v${{ env.APP_VERSION }}/PosRonda-Full.exe)**: Biner mandiri tunggal dengan FFmpeg terintegrasi di dalamnya.

          #### 2. PosRonda Lite Edition (Untuk Teknisi / Laptop dengan FFmpeg)
          *Ukuran unduhan lebih hemat (~99 MB) bagi laptop yang sudah terpasang FFmpeg di sistemnya.*
          - **[PosRonda-v${{ env.APP_VERSION }}-Lite.zip](https://github.com/harunarrosyid/PosRonda/releases/download/v${{ env.APP_VERSION }}/PosRonda-v${{ env.APP_VERSION }}-Lite.zip)**: Paket ZIP biner PosRonda ringan.
          - **[PosRonda-Lite.exe](https://github.com/harunarrosyid/PosRonda/releases/download/v${{ env.APP_VERSION }}/PosRonda-Lite.exe)**: Biner mandiri Lite.

          ---

          ### ⚙️ Catatan Sistem:
          - **Python**: **TIDAK PERLU DIINSTAL**. Seluruh runtime Python 3.11 dan modul OpenCV sudah terbungkus secara terisolasi di dalam executable.
          - **FFmpeg**:
            - Versi **Full**: Sudah mencakup FFmpeg resmi dengan akselerasi hardware Intel QuickSync (`h264_qsv`) dan `libx264`.
            - Versi **Lite**: Otomatis mendeteksi FFmpeg yang sudah ada di System PATH laptop Anda. Jika belum ada, Anda bisa memilih file `ffmpeg.exe` lewat tombol di aplikasi untuk disalin otomatis ke folder PosRonda.
        files: |
          PosRonda-v*.zip
          dist/PosRonda-Full.exe
          dist/PosRonda-Lite.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
