name: Build PosRonda Windows EXE (Cython C-Binary Core)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Compile PosRonda.exe (Cython .pyd + PyInstaller)
    runs-on: windows-latest

    steps:
    - name: 1. Checkout Repository
      uses: actions/checkout@v4

    - name: 2. Setup Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: 3. Install Dependencies & Build Tools
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: 4. Compile Core Proprietary Engine with Cython (.pyd Native C Binary)
      run: |
        python setup_cython.py build_ext --inplace
        echo "=== Hasil Kompilasi Cython (.pyd) ==="
        dir src\posronda\core\*.pyd

    - name: 5. Build Windows Native EXE with PyInstaller
      run: |
        pyinstaller PosRonda.spec --clean --noconfirm

    - name: 6. Verify Executable Output
      shell: bash
      run: |
        if [ -f "dist/PosRonda.exe" ]; then
          echo "✔ File PosRonda.exe (Cython-Protected) berhasil dibuat!"
          ls -lh dist/PosRonda.exe
        else
          echo "❌ dist/PosRonda.exe tidak ditemukan!"
          exit 1
        fi

    - name: 7. Upload Encrypted EXE Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PosRonda-Windows-v4.0
        path: |
          dist/PosRonda.exe
          config.json
          docs/PANDUAN.md
        retention-days: 30
